name: firebase_app_check
description: Firebase App Check for Windows (Claw Integrated)
version: 0.0.1
homepage: https://github.com/ben-milanko/firebase_app_check
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.7.0
  firebase_app_check_platform_interface: ^0.2.0
  firebase_app_check_web: ">=0.2.3 <1.0.0"
  firebase_core_platform_interface: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: io.flutter.plugins.firebase.appcheck
        pluginClass: FlutterFirebaseAppCheckPlugin
      ios:
        pluginClass: FLTFirebaseAppCheckPlugin
      macos:
        pluginClass: FLTFirebaseAppCheckPlugin
      web:
        default_package: firebase_app_check_web
      windows:
        pluginClass: FirebaseAppCheckPlugin
